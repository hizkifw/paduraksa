version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The source generator must build against a Roslyn no newer than the SDK's compiler
      # (see Directory.Packages.props); bump these by hand together with the SDK.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The Dockerfile pins its base images by digest, so a security patch in the .NET or Ubuntu base only reaches the
  # image through these bumps.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
