version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The source generator must build against a Roslyn no newer than the SDK's compiler
      # (see Directory.Packages.props); bump these by hand together with the SDK.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
