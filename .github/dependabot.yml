version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The source generator must build against a Roslyn no newer than the SDK's compiler
      # (see Directory.Packages.props); bump these by hand together with the SDK.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The app targets .NET 10: its runtime packages and dotnet-ef move to 11 together with the SDK and the base
      # images, by hand, not as part of a weekly group.
      - dependency-name: Microsoft.EntityFrameworkCore.*
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.AspNetCore.*
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.Extensions.*
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet-ef
        update-types: ["version-update:semver-major"]
      # Paduraksa.ProxyProtocol also targets net8.0, which System.IO.Pipelines 9 and later don't support.
      - dependency-name: System.IO.Pipelines
        update-types: ["version-update:semver-major"]
      # 3.0 changes the API the CLI is built on: a migration of its own.
      - dependency-name: System.CommandLine
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The Dockerfile pins its base images by digest, so a security patch in the .NET or Ubuntu base only reaches the
  # image through these bumps.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
