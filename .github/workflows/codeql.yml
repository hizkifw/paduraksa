name: CodeQL

# Static analysis of the C# product code (threat model G9, PLAN §15): on every push to main and pull request, and weekly, because the queries
# improve between runs. Results show in the repository's Security tab (code scanning).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Manual build mode: the Server project builds every product project it references, and nothing else (no tests, benchmarks or fuzz
      # harnesses), so the database holds what ships. Autobuild would build the whole solution file. The compiler server is off because
      # CodeQL's tracer has to see each compilation.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: >-
          dotnet build src/Paduraksa.Server/Paduraksa.Server.csproj -c Release
          -p:UseSharedCompilation=false --no-incremental

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
