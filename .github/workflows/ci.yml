name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the image under its version too (see the publish job).
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. On PRs a new push supersedes the in-flight run; pushes to main
# queue instead, so every main commit gets a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  TEST_RESULTS: ${{ github.workspace }}/TestResults

jobs:
  build-test:
    name: Build, test, format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # setup-dotnet's built-in cache needs packages.lock.json; we key on the central
      # package versions and project files instead.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --no-restore -c Release

      # global.json opts into Microsoft.Testing.Platform, so this runs each xUnit v3 test
      # app directly and exits non-zero on any failure.
      # A project that runs zero tests exits 8 and fails the step on purpose.
      # Two test apps at a time: all nine at once on the runner's four cores starved the bUnit renderer and the integration
      # hosts into timeouts (waits past 30 s in tests that take 2 s alone); Integration's own length sets the step's time anyway.
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --max-parallel-test-modules 2
          --results-directory "$TEST_RESULTS"
          --report-xunit-trx
          --report-xunit-markdown

      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for f in "$TEST_RESULTS"/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; done

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS }}
          if-no-files-found: ignore

      # Runs whether or not the tests passed, so both kinds of failure show up in one run.
      # dotnet format has no -c/--configuration and rejects -p:. MSBuild picks up environment
      # variables as properties, so Configuration=Release makes dotnet format's design-time build
      # use the Release outputs from the build step instead of creating a Debug tree.
      # TODO(M5 dashboard): dotnet format doesn't check .razor files; revisit when the Dashboard grows.
      - name: Verify formatting
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          Configuration: Release
        run: dotnet format --no-restore --verify-no-changes

  # Builds the image for every platform the publish job pushes, into the Actions cache, and runs the container smoke test
  # against the amd64 build. Runs next to build-test rather than after it, so the publish only waits for the slower of
  # the two.
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build (amd64 and arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: paduraksa:ci
          cache-from: type=gha

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Container smoke test
        env:
          PADURAKSA_CONTAINER_TESTS: "1"
          PADURAKSA_CONTAINER_IMAGE: paduraksa:ci
        run: dotnet test --project tests/Paduraksa.Tests.Integration -c Release -- --filter-trait "Category=Container"

  # Pushes to ghcr.io/<owner>/<repo> once the tests and the image both pass: `main` and `sha-<short>` for a push to
  # main; the version, `<major>.<minor>` and `latest` for a `v*` tag (no `latest` for a pre-release). Everything comes
  # from the image job's cache, so this only assembles and uploads.
  publish:
    name: Publish image
    needs: [build-test, image]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          # SLSA provenance and an SBOM go up with the image as attestations.
          provenance: mode=max
          sbom: true

  # Packs Paduraksa.ProxyProtocol and Paduraksa.ProxyProtocol.AspNetCore (src/Packaging.props) on every run, so a change that breaks packing or the
  # package validation fails here and not at the tag. A `v*` tag packs them at the tag's version (v0.1.0 -> 0.1.0); any other run packs the
  # version in Packaging.props. The packages are uploaded as an artifact either way.
  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pack
        run: |
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_args=("-p:Version=${GITHUB_REF_NAME#v}")
          fi
          for project in Paduraksa.ProxyProtocol Paduraksa.ProxyProtocol.AspNetCore; do
            dotnet pack "src/$project" -c Release -warnaserror -o artifacts/nupkg "${version_args[@]}"
          done
          ls -l artifacts/nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nupkg/*
          if-no-files-found: error

  # Pushes the packs to nuget.org for a `v*` tag once the tests pass. It does nothing until the repository has a NUGET_API_KEY secret:
  # without it the push step is skipped and the job says so. The runner's own .NET SDK does the push. A package version that is already on nuget.org is skipped, so re-running a tag is safe.
  publish-nuget:
    name: Publish NuGet packages
    needs: [build-test, pack]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Download the packages
        if: ${{ env.NUGET_API_KEY != '' }}
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nupkg

      # nuget.org takes the symbols as a package of their own: the .snupkg is pushed explicitly, after the .nupkg it belongs to
      # (the "*.nupkg" glob does not match ".snupkg").
      - name: Push the packages to nuget.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "artifacts/nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push the symbol packages to nuget.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "artifacts/nupkg/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Skipped, no NUGET_API_KEY
        if: ${{ env.NUGET_API_KEY == '' }}
        run: echo "::notice::The NUGET_API_KEY secret is not set, so nothing was pushed to nuget.org (docs/development.md, Publishing the NuGet packages)."
