name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the image under its version too (see the publish job). A `proxyprotocol-v*` tag is the NuGet packages'
    # own release (see the publish-nuget job): they ship when they change, not with every release of the app.
    tags: ["v*", "proxyprotocol-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. On PRs a new push supersedes the in-flight run; pushes to main
# queue instead, so every main commit gets a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  TEST_RESULTS: ${{ github.workspace }}/TestResults

jobs:
  build-test:
    name: Build, test, format
    runs-on: ubuntu-latest
    # A run took about 10 minutes before the browser and QUIC tests ran too; they and their installs add several.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # setup-dotnet's built-in cache needs packages.lock.json; we key on the central
      # package versions and project files instead.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --no-restore -c Release

      # The Playwright tests need a Chromium and the QUIC tests need libmsquic. Without them they skip, which once let CI run
      # with 19 browser and 19 QUIC tests silently off, so the Test step also sets PADURAKSA_REQUIRE (tests/Shared/Requirements.cs):
      # a missing one fails its tests instead.
      #
      # Chromium: the build Playwright pins for the package version, with the system libraries it links. Ubuntu's own chromium
      # package is a snap, which a headless test run can't rely on. The browser download is cached by Playwright's version; the
      # libraries come from apt every run.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}

      - name: Install Chromium
        run: pwsh tests/Paduraksa.Tests.Dashboard/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # libmsquic: the version the Dockerfile ships, from Microsoft's package feed for this Ubuntu, so the QUIC tests run against
      # the library production uses.
      - name: Install libmsquic
        run: |
          version="$(sed -n 's/^ARG LIBMSQUIC_VERSION=//p' Dockerfile)"
          test -n "$version"
          sudo apt-get update
          # The runner image may already have Microsoft's feed configured; add it only when it doesn't offer the version.
          if ! apt-cache madison libmsquic | grep -F " $version " > /dev/null; then
            . /etc/os-release
            curl -fsSL -o "$RUNNER_TEMP/packages-microsoft-prod.deb" "https://packages.microsoft.com/config/${ID}/${VERSION_ID}/packages-microsoft-prod.deb"
            sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo apt-get update
          fi
          sudo apt-get install -y --no-install-recommends "libmsquic=${version}"
          ldconfig -p | grep 'libmsquic\.so'

      # global.json opts into Microsoft.Testing.Platform, so this runs each xUnit v3 test
      # app directly and exits non-zero on any failure.
      # A project that runs zero tests exits 8 and fails the step on purpose.
      # Two test apps at a time: all nine at once on the runner's four cores starved the bUnit renderer and the integration
      # hosts into timeouts (waits past 30 s in tests that take 2 s alone); Integration's own length sets the step's time anyway.
      # The Pebble tests use the runner's Docker and pull their image from ghcr.io.
      - name: Test
        env:
          PADURAKSA_REQUIRE: playwright,quic,pebble
        run: >-
          dotnet test --no-build -c Release
          --max-parallel-test-modules 2
          --results-directory "$TEST_RESULTS"
          --report-xunit-trx
          --report-xunit-markdown

      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for f in "$TEST_RESULTS"/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; done

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS }}
          if-no-files-found: ignore

      # Runs whether or not the tests passed, so both kinds of failure show up in one run.
      # dotnet format has no -c/--configuration and rejects -p:. MSBuild picks up environment
      # variables as properties, so Configuration=Release makes dotnet format's design-time build
      # use the Release outputs from the build step instead of creating a Debug tree.
      # TODO(M5 dashboard): dotnet format doesn't check .razor files; revisit when the Dashboard grows.
      - name: Verify formatting
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          Configuration: Release
        run: dotnet format --no-restore --verify-no-changes

  # Builds the image for every platform the publish job pushes, into the Actions cache, and runs the container smoke test
  # against the amd64 build. Runs next to build-test rather than after it, so the publish only waits for the slower of
  # the two.
  image:
    name: Container image
    # A package tag releases no image.
    if: ${{ !startsWith(github.ref, 'refs/tags/proxyprotocol-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build (amd64 and arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          # GET /api/v1/version names the commit the image was built from.
          build-args: PADURAKSA_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          # GET /api/v1/version names the commit the image was built from.
          build-args: PADURAKSA_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: paduraksa:ci
          cache-from: type=gha

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Container smoke test
        env:
          PADURAKSA_CONTAINER_TESTS: "1"
          PADURAKSA_CONTAINER_IMAGE: paduraksa:ci
        run: dotnet test --project tests/Paduraksa.Tests.Integration -c Release -- --filter-trait "Category=Container"

  # Pushes to ghcr.io/<owner>/<repo> once the tests and the image both pass: `main` and `sha-<short>` for a push to
  # main; the version, `<major>.<minor>` and `latest` for a `v*` tag (no `latest` for a pre-release). Everything comes
  # from the image job's cache, so this only assembles and uploads.
  publish:
    name: Publish image
    needs: [build-test, image]
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/proxyprotocol-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          # GET /api/v1/version names the commit the image was built from.
          build-args: PADURAKSA_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          # SLSA provenance and an SBOM go up with the image as attestations.
          provenance: mode=max
          sbom: true

  # Packs Paduraksa.ProxyProtocol and Paduraksa.ProxyProtocol.AspNetCore (src/Packaging.props) on every run, so a change that breaks packing or the
  # package validation fails here and not at the tag. A `proxyprotocol-v*` tag packs them at the tag's version (proxyprotocol-v0.1.0 -> 0.1.0); any
  # other run packs the version in Packaging.props. The packages are uploaded as an artifact either way.
  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pack
        run: |
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/proxyprotocol-v* ]]; then
            version_args=("-p:Version=${GITHUB_REF_NAME#proxyprotocol-v}")
          fi
          for project in Paduraksa.ProxyProtocol Paduraksa.ProxyProtocol.AspNetCore; do
            dotnet pack "src/$project" -c Release -warnaserror -o artifacts/nupkg "${version_args[@]}"
          done
          ls -l artifacts/nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nupkg/*
          if-no-files-found: error

  # Pushes the packs to nuget.org for a `proxyprotocol-v*` tag once the tests pass (the app's own `v*` tags publish no package).
  # No API key is stored: nuget.org's trusted publishing exchanges this job's GitHub OIDC token for a key that lives one hour, under the policy that
  # names this repository and this workflow file (docs/development.md, Publishing the NuGet packages). It does nothing until the repository has a
  # NUGET_USER variable (the nuget.org profile name that owns the policy): without it the push is skipped and the job says so.
  # A package version that is already on nuget.org is skipped, so re-running a tag is safe.
  publish-nuget:
    name: Publish NuGet packages
    needs: [build-test, pack]
    if: ${{ startsWith(github.ref, 'refs/tags/proxyprotocol-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token nuget.org checks against the policy. Only this job can ask for one.
      id-token: write
    steps:
      - name: Download the packages
        if: ${{ vars.NUGET_USER != '' }}
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nupkg

      # Right before the push: the key it returns is valid for one hour, and an OIDC token buys one key.
      - name: NuGet login (OIDC for a temporary API key)
        if: ${{ vars.NUGET_USER != '' }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # One push: for each .nupkg, `dotnet nuget push` also pushes the .snupkg lying beside it (--no-symbols is what turns that off).
      - name: Push the packages and their symbols to nuget.org
        if: ${{ vars.NUGET_USER != '' }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Skipped, no NUGET_USER
        if: ${{ vars.NUGET_USER == '' }}
        run: echo "::notice::The NUGET_USER variable is not set, so nothing was pushed to nuget.org (docs/development.md, Publishing the NuGet packages)."
