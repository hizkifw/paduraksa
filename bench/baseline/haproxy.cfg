# HAProxy as the reverse proxy under test. Tuned only where its defaults would make the comparison unfair:
# keep-alive to the upstream (YARP, Caddy and nginx keep upstream connections), the full X-Forwarded-* trio, and no
# per-connection request cap. One thread per CPU in the container's CPU set.
global
    nbthread 4
    # The access-log scenario's lines go to a local UDP syslog sink (the harness starts one): HAProxy has no log file
    # of its own, only syslog, stdout and stderr.
    log 127.0.0.1:18091 local0
    # The harness gives every container a 65,536-FD limit; HAProxy needs about 2x maxconn plus headroom.
    maxconn 30000
    hard-stop-after 5s

defaults
    mode http
    timeout connect 60s
    timeout client 120s
    timeout server 120s
    timeout http-keep-alive 120s
    timeout http-request 60s
    option forwardfor
    # Reuse idle upstream connections on every request; HAProxy's default ("safe") only pools them where the server
    # explicitly agrees, which churns connections at this concurrency.
    http-reuse always

frontend public
    # Logging is per frontend, not per host: `log global` turns it on and the host rule below silences it for every
    # request that isn't the access-log scenario's, so the other scenarios send no log lines. The format is the
    # combined one.
    log global
    log-format "%ci - - [%tr] \"%HM %HP %HV\" %ST %B \"%[capture.req.hdr(0)]\" \"%[capture.req.hdr(1)]\""
    acl access_log_host req.hdr(host),host_only -i access-log.test
    http-request set-log-level silent unless access_log_host
    declare capture request len 256
    declare capture request len 256
    http-request capture req.hdr(referer) id 0 if access_log_host
    http-request capture req.hdr(user-agent) id 1 if access_log_host

    bind 127.0.0.1:18084
    bind 127.0.0.1:18446 ssl crt /certs/haproxy.pem alpn h2,http/1.1

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http unless { ssl_fc }
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    # Host routing ignores the port oha's --connect-to puts in the Host header.
    acl respond_host req.hdr(host),host_only -i respond.test
    http-request return status 200 content-type "text/plain; charset=utf-8" string "ok\n" if respond_host

    # Rate limits: a stick table per policy keyed by client address, tracking the request rate over a sliding window
    # (a rate counter smoothed over the current and previous period). The deny rule counts the request being tracked,
    # so `gt 1` over an hour lets one request through and refuses the rest with the 429 below.
    acl rate_limit_host req.hdr(host),host_only -i rate-limit.test
    acl rate_limited_host req.hdr(host),host_only -i rate-limited.test
    http-request track-sc0 src table rate_allowed if rate_limit_host
    http-request track-sc1 src table rate_refused if rate_limited_host
    http-request deny deny_status 429 if rate_limit_host { sc_http_req_rate(0,rate_allowed) gt 1000000 }
    http-request deny deny_status 429 if rate_limited_host { sc_http_req_rate(1,rate_refused) gt 1 }

    # cf: with loopback as the peer (a stand-in for cloudflared), the client address is CF-Connecting-IP. `option
    # forwardfor` then writes that address into X-Forwarded-For.
    acl cf_host req.hdr(host),host_only -i cf.test
    http-request set-src hdr(CF-Connecting-IP) if cf_host { src 127.0.0.1/32 }

    # error-page: a server on a closed port, with no health check.
    acl error_page_host req.hdr(host),host_only -i error-page.test
    use_backend closed if error_page_host

    # The `websocket` scenario's host: HAProxy passes an Upgrade through on its own; `timeout tunnel` is the idle limit
    # once the connection is upgraded.
    acl websocket_host req.hdr(host),host_only -i ws.test
    use_backend websocket if websocket_host

    default_backend upstream

backend upstream
    server upstream 127.0.0.1:18080 pool-max-conn 256

backend websocket
    timeout tunnel 120s
    server echo 127.0.0.1:18090

# A closed port, no `check`, so HAProxy keeps trying it. A refused connect is a 503 in HAProxy (502 is its code for an
# invalid response), so the error file for 503 carries the 502 page: the harness writes it from bench/baseline/error-502.html.
backend closed
    errorfile 503 /usr/local/etc/haproxy/error-502.http
    server closed 127.0.0.1:18079

backend rate_allowed
    stick-table type ip size 1k expire 1h store http_req_rate(1s)

backend rate_refused
    stick-table type ip size 1k expire 2h store http_req_rate(1h)
