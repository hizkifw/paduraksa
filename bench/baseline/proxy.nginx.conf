# nginx as the reverse proxy under test. Tuned only where its defaults would make the comparison unfair:
# keep-alive to the upstream (YARP and Caddy pool upstream connections by default) and no per-connection request
# cap (Kestrel and Caddy have none; nginx's default closes every client and upstream connection after 1000).
# One worker per CPU in the container's CPU set (nginx's `auto` honours the affinity mask).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-proxy.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    server_tokens off;
    keepalive_requests 10000000;
    keepalive_timeout 120s;
    # nginx reads a request body before it connects upstream, and its default buffer (8 or 16 KiB) sends anything bigger
    # to a temp file, with a warning per request. 128 KiB holds the `upload-64k` body in memory, as a deployment that
    # takes uploads would size it.
    client_body_buffer_size 128k;

    # The rate-limit scenarios' zones, keyed by client address (leaky bucket in nginx's accounting, millisecond
    # resolution): a rate far above the load with a burst that is never used up, and one request a minute, the
    # slowest rate nginx accepts (it has no per-hour unit). `limit_req_log_level info` keeps the refusals out of the
    # error log, which is at warn.
    limit_req_zone $binary_remote_addr zone=allowed:1m rate=1000000r/s;
    limit_req_zone $binary_remote_addr zone=refused:1m rate=1r/m;
    limit_req_status 429;
    limit_req_log_level info;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_session_cache shared:SSL:10m;

    upstream up {
        server 127.0.0.1:18080;
        keepalive 256;
        keepalive_requests 10000000;
        keepalive_timeout 120s;
    }

    # Proxy host: forwards with the same X-Forwarded-* trio YARP and Caddy add by default. `reuseport` gives each
    # worker its own accept queue; without it a burst of 64 connections can land on one or two workers (seen as
    # nginx using ~1 of its 4 CPUs).
    server {
        listen 127.0.0.1:18082 reuseport;
        listen 127.0.0.1:18444 ssl reuseport;
        http2 on;
        server_name bench.test;

        location / {
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # The `websocket` scenario's host: the same forwarding to the WebSocket echo server, with the upgrade headers nginx
    # needs to pass (it doesn't by default). The 120 s read timeout matches the other proxies' idle timeouts.
    server {
        listen 127.0.0.1:18082;
        listen 127.0.0.1:18444 ssl;
        http2 on;
        server_name ws.test;

        location / {
            proxy_pass http://127.0.0.1:18090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # The hosts the comparison scenarios use (they run against Paduraksa on extra hosts too). Plain HTTP only; every
    # one forwards like bench.test, and the headers are written out because a location that sets any proxy_set_header
    # inherits none from above.
    upstream closed {
        server 127.0.0.1:18079;
    }

    # access-log: the combined format to a file, buffered (64 KiB, flushed every second) as a tuned deployment would.
    server {
        listen 127.0.0.1:18082;
        server_name access-log.test;
        access_log /tmp/access.log combined buffer=64k flush=1s;

        location / {
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # rate-limit: a budget the run never reaches. rate-limited: one request a minute, no burst, so after the first
    # request every one is a 429.
    server {
        listen 127.0.0.1:18082;
        server_name rate-limit.test;

        location / {
            limit_req zone=allowed burst=1000000 nodelay;
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    server {
        listen 127.0.0.1:18082;
        server_name rate-limited.test;

        location / {
            limit_req zone=refused;
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # compressed: gzip on the proxied page, at level 1 like the others' fastest, from 1 KiB.
    server {
        listen 127.0.0.1:18082;
        server_name compressed.test;
        gzip on;
        gzip_proxied any;
        gzip_comp_level 1;
        gzip_min_length 1024;
        gzip_types text/html text/plain text/css application/json application/javascript;

        location / {
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # headers: the request rules are proxy_set_header (an empty value drops the header; there is no "append" for a
    # request header, so the added one is a set of a header the client never sends). The response side is stock too:
    # proxy_hide_header takes the upstream's copy off and add_header ... always writes ours. add_header only adds, so a
    # "set" of a header the upstream also sends has to hide it first, or the client gets both.
    server {
        listen 127.0.0.1:18082;
        server_name headers.test;

        location / {
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Bench-Replace "replaced";
            proxy_set_header X-Bench-Tenant "acme";
            proxy_set_header X-Bench-Added "one";
            proxy_set_header X-Bench-Drop "";
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "DENY" always;
            add_header X-Bench-Policy "max-age=31536000" always;
        }
    }

    # rewrite: /app/x?q becomes /api/x?q. A `rewrite ... break` keeps the query string and, with a proxy_pass that has no URI
    # part, sends the rewritten URI.
    server {
        listen 127.0.0.1:18082;
        server_name rewrite.test;

        location /app/ {
            rewrite ^/app(/.*)$ /api$1 break;
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # rewrite-redirect: the same, with proxy_redirect mapping a Location that starts with /api/ back to /app/. It is a
    # prefix replacement on the header text, so it maps what starts with the prefix and nothing else.
    server {
        listen 127.0.0.1:18082;
        server_name rewrite-redirect.test;

        location /app/ {
            rewrite ^/app(/.*)$ /api$1 break;
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_redirect /api/ /app/;
            # Without this nginx turns the mapped path into an absolute URL from its own server name and port.
            absolute_redirect off;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # error-page: a closed port (a single-server upstream is never marked down, so every request tries it), and the
    # 502 page from a static file. nginx logs every refused connect at error level; this host's log is cut to crit so
    # the scenario measures the page and not the logging.
    server {
        listen 127.0.0.1:18082;
        server_name error-page.test;
        error_log /dev/null crit;
        error_page 502 /error-502.html;

        location / {
            proxy_pass http://closed;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location = /error-502.html {
            internal;
            root /srv;
            default_type "text/html; charset=utf-8";
        }
    }

    # cf: the client address comes from CF-Connecting-IP when the peer is loopback (a stand-in for cloudflared, as in
    # Paduraksa's Tunnel mode), and $proxy_add_x_forwarded_for then forwards that address.
    server {
        listen 127.0.0.1:18082;
        server_name cf.test;
        set_real_ip_from 127.0.0.1;
        real_ip_header CF-Connecting-IP;

        location / {
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # Answered by the proxy itself (Paduraksa: a Respond host).
    server {
        listen 127.0.0.1:18082;
        listen 127.0.0.1:18444 ssl;
        http2 on;
        server_name respond.test;

        location / {
            default_type "text/plain; charset=utf-8";
            return 200 "ok\n";
        }
    }
}
