# nginx as the reverse proxy under test. Tuned only where its defaults would make the comparison unfair:
# keep-alive to the upstream (YARP and Caddy pool upstream connections by default) and no per-connection request
# cap (Kestrel and Caddy have none; nginx's default closes every client and upstream connection after 1000).
# One worker per CPU in the container's CPU set (nginx's `auto` honours the affinity mask).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-proxy.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    server_tokens off;
    keepalive_requests 10000000;
    keepalive_timeout 120s;
    # nginx reads a request body before it connects upstream, and its default buffer (8 or 16 KiB) sends anything bigger
    # to a temp file, with a warning per request. 128 KiB holds the `upload-64k` body in memory, as a deployment that
    # takes uploads would size it.
    client_body_buffer_size 128k;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_session_cache shared:SSL:10m;

    upstream up {
        server 127.0.0.1:18080;
        keepalive 256;
        keepalive_requests 10000000;
        keepalive_timeout 120s;
    }

    # Proxy host: forwards with the same X-Forwarded-* trio YARP and Caddy add by default. `reuseport` gives each
    # worker its own accept queue; without it a burst of 64 connections can land on one or two workers (seen as
    # nginx using ~1 of its 4 CPUs).
    server {
        listen 127.0.0.1:18082 reuseport;
        listen 127.0.0.1:18444 ssl reuseport;
        http2 on;
        server_name bench.test;

        location / {
            proxy_pass http://up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # The `websocket` scenario's host: the same forwarding to the WebSocket echo server, with the upgrade headers nginx
    # needs to pass (it doesn't by default). The 120 s read timeout matches the other proxies' idle timeouts.
    server {
        listen 127.0.0.1:18082;
        listen 127.0.0.1:18444 ssl;
        http2 on;
        server_name ws.test;

        location / {
            proxy_pass http://127.0.0.1:18090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # Answered by the proxy itself (Paduraksa: a Respond host).
    server {
        listen 127.0.0.1:18082;
        listen 127.0.0.1:18444 ssl;
        http2 on;
        server_name respond.test;

        location / {
            default_type "text/plain; charset=utf-8";
            return 200 "ok\n";
        }
    }
}
