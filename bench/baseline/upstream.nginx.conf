# The shared upstream for every proxy under test: a static 200 from memory, no disk, no logging.
# One worker per CPU in the container's CPU set (nginx's `auto` honours the affinity mask).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-upstream.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    keepalive_requests 10000000;
    keepalive_timeout 120s;

    server {
        listen 127.0.0.1:18080 reuseport;
        location / {
            default_type text/plain;
            return 200 "upstream ok\n";
        }

        location = /64k {
            default_type text/plain;
            alias /srv/64k.txt;
        }
    }
}
