# The shared upstream for every proxy under test: a static 200 from memory, no disk, no logging.
# One worker per CPU in the container's CPU set (nginx's `auto` honours the affinity mask).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-upstream.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    keepalive_requests 10000000;
    keepalive_timeout 120s;

    server {
        listen 127.0.0.1:18080 reuseport;
        location / {
            default_type text/plain;
            return 200 "upstream ok\n";
        }

        location = /64k {
            default_type text/plain;
            alias /srv/64k.txt;
        }

        # The `compressed` scenario's page: 16 KiB of HTML-like text the proxy compresses (nginx's own gzip stays off).
        location = /text {
            default_type text/html;
            alias /srv/text.html;
        }

        # The `upload-64k` scenario's target. `return` would answer in the rewrite phase and only discard what is left
        # of the body, so the request goes through a content handler (empty_gif, which refuses POST with 405, mapped
        # to the real answer) behind a mirror, whose `mirror_request_body` makes nginx read the whole body first (into
        # memory: the buffer holds 64 KiB, nothing touches the disk). The mirror's own answer is discarded.
        location = /upload {
            client_body_buffer_size 128k;
            mirror /sink;
            mirror_request_body on;
            error_page 405 =200 @uploaded;
            empty_gif;
        }

        location @uploaded {
            default_type text/plain;
            return 200 "upstream ok\n";
        }

        location = /sink {
            internal;
            return 204;
        }

        # The 502 page Traefik's errors middleware fetches (the other proxies serve it themselves); mounted from
        # bench/baseline/error-502.html.
        location = /error-502.html {
            default_type "text/html; charset=utf-8";
            alias /srv/error-502.html;
        }

        # What the harness's pre-run checks ask the upstream: the X-Forwarded-For it received, to prove a proxy
        # forwards the client address it resolved.
        location = /xff {
            default_type text/plain;
            add_header X-Seen-Forwarded-For $http_x_forwarded_for always;
            return 200 "upstream ok\n";
        }
    }
}
