# The shared upstream for every proxy under test: a static 200 from memory, no disk, no logging.
# One worker per CPU in the container's CPU set (nginx's `auto` honours the affinity mask).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-upstream.pid;

events {
    worker_connections 8192;
}

http {
    access_log off;
    keepalive_requests 10000000;
    keepalive_timeout 120s;

    # What a probe (a request with `X-Bench-Probe: 1`) asks the upstream to echo for the `headers`, `rewrite` and
    # `rewrite-redirect` checks: the request headers and the URI it received, in `X-Seen-*` response headers. Without the
    # probe header every value is empty, and nginx doesn't send a header whose value is empty, so measured requests
    # carry none of it. A header the proxy removed reads "(absent)", so a removal is a positive answer.
    map $http_x_bench_replace $bench_replace { "" "(absent)"; default $http_x_bench_replace; }
    map $http_x_bench_tenant $bench_tenant { "" "(absent)"; default $http_x_bench_tenant; }
    map $http_x_bench_added $bench_added { "" "(absent)"; default $http_x_bench_added; }
    map $http_x_bench_drop $bench_drop { "" "(absent)"; default $http_x_bench_drop; }
    map $http_x_bench_probe $seen_replace { default ""; 1 $bench_replace; }
    map $http_x_bench_probe $seen_tenant { default ""; 1 $bench_tenant; }
    map $http_x_bench_probe $seen_added { default ""; 1 $bench_added; }
    map $http_x_bench_probe $seen_drop { default ""; 1 $bench_drop; }
    map $http_x_bench_probe $seen_uri { default ""; 1 $request_uri; }

    server {
        listen 127.0.0.1:18080 reuseport;
        location / {
            default_type text/plain;
            return 200 "upstream ok\n";
        }

        # The `headers` scenario's page: the plain answer with two headers the proxy's rules take off or replace
        # (`X-Powered-By`, and an `X-Frame-Options` the rule sets to DENY), plus the probe's echo of the request headers.
        location = /hdr {
            default_type text/plain;
            add_header X-Powered-By "bench-upstream" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Seen-Replace $seen_replace always;
            add_header X-Seen-Tenant $seen_tenant always;
            add_header X-Seen-Added $seen_added always;
            add_header X-Seen-Drop $seen_drop always;
            return 200 "upstream ok\n";
        }

        # The `rewrite` and `rewrite-redirect` scenarios' targets: only /api/... is answered. The client's /app/... must
        # arrive as /api/..., so a path that wasn't rewritten (/app/..., or the stripped /users/...) is a 404 rather
        # than the 200 that `/` gives everything else; the probe also reads back the URI the upstream saw.
        location ^~ /api/ {
            default_type text/plain;
            add_header X-Seen-Uri $seen_uri always;
            return 200 "upstream ok\n";
        }

        # Answers with a redirect into /api/ (a path-absolute Location, which the proxy must map back to /app/...). A
        # path with no prefix to map back would also reach here, which is the probe's point.
        location ^~ /api/redirect/ {
            absolute_redirect off;
            add_header X-Seen-Uri $seen_uri always;
            return 302 /api/login;
        }

        location ~ ^/(app|users|items|orders)/ {
            return 404;
        }

        location = /64k {
            default_type text/plain;
            alias /srv/64k.txt;
        }

        # The `compressed` scenario's page: 16 KiB of HTML-like text the proxy compresses (nginx's own gzip stays off).
        location = /text {
            default_type text/html;
            alias /srv/text.html;
        }

        # The `upload-64k` scenario's target. `return` would answer in the rewrite phase and only discard what is left
        # of the body, so the request goes through a content handler (empty_gif, which refuses POST with 405, mapped
        # to the real answer) behind a mirror, whose `mirror_request_body` makes nginx read the whole body first (into
        # memory: the buffer holds 64 KiB, nothing touches the disk). The mirror's own answer is discarded.
        location = /upload {
            client_body_buffer_size 128k;
            mirror /sink;
            mirror_request_body on;
            error_page 405 =200 @uploaded;
            empty_gif;
        }

        location @uploaded {
            default_type text/plain;
            return 200 "upstream ok\n";
        }

        location = /sink {
            internal;
            return 204;
        }

        # The 502 page Traefik's errors middleware fetches (the other proxies serve it themselves); mounted from
        # bench/baseline/error-502.html.
        location = /error-502.html {
            default_type "text/html; charset=utf-8";
            alias /srv/error-502.html;
        }

        # What the harness's pre-run checks ask the upstream: the X-Forwarded-For it received, to prove a proxy
        # forwards the client address it resolved.
        location = /xff {
            default_type text/plain;
            add_header X-Seen-Forwarded-For $http_x_forwarded_for always;
            return 200 "upstream ok\n";
        }
    }
}
