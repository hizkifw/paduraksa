# traefik.yml with the access log on, for the `access-log` scenario only: Traefik's access log is static
# configuration for the whole instance, so the harness restarts it with this file for that scenario and runs the rest
# without. The log goes to a file in the container, in Traefik's default (common log) format, through a buffer of 100
# lines that a background writer drains.
# Traefik as the reverse proxy under test. The file provider only (no Docker provider), no dashboard/API, no access
# log, loopback only. Traefik has no built-in static response, so respond.test is not configured and the `answered`
# scenario is skipped for it (bench/README.md).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: "127.0.0.1:18085"
  websecure:
    address: "127.0.0.1:18447"
    http:
      tls: {}

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: false

log:
  level: ERROR

accessLog:
  filePath: /tmp/access.log
  bufferingSize: 100
