# Traefik's file provider: one proxied host on both entry points, HTTP/1.1 keep-alive to the upstream (Traefik pools
# by default; the raised cap matches nginx's and Caddy's), and the timeouts the other proxies use. X-Forwarded-For,
# -Proto, -Host, -Port and X-Real-Ip are Traefik's defaults. The throwaway certificate is dynamic configuration.
tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem

http:
  serversTransports:
    bench:
      maxIdleConnsPerHost: 256
      forwardingTimeouts:
        dialTimeout: 60s
        responseHeaderTimeout: 0s
        idleConnTimeout: 120s

  # The comparison scenarios' policies: rateLimit is a token bucket (golang.org/x/time/rate) per client address by
  # default; errors fetches the 502 page from a service, here the shared upstream, which is one extra proxied request
  # for every error.
  middlewares:
    rate-allowed:
      rateLimit:
        average: 1000000
        period: 1s
        burst: 1048575
    rate-refused:
      rateLimit:
        average: 1
        period: 1h
        burst: 1
    error-502:
      errors:
        status: ["502"]
        service: error-pages
        query: /error-502.html

  routers:
    bench-web:
      rule: Host(`bench.test`)
      entryPoints: [web]
      service: bench
    bench-websecure:
      rule: Host(`bench.test`)
      entryPoints: [websecure]
      service: bench
      tls: {}

    # The comparison scenarios' hosts, on the plain entry point only. access-log needs no router of its own: the access
    # log is static configuration (traefik-accesslog.yml), so the harness restarts Traefik with it for that scenario.
    access-log:
      rule: Host(`access-log.test`)
      entryPoints: [web]
      service: bench
    rate-limit:
      rule: Host(`rate-limit.test`)
      entryPoints: [web]
      middlewares: [rate-allowed]
      service: bench
    rate-limited:
      rule: Host(`rate-limited.test`)
      entryPoints: [web]
      middlewares: [rate-refused]
      service: bench
    error-page:
      rule: Host(`error-page.test`)
      entryPoints: [web]
      middlewares: [error-502]
      service: closed

    # The `websocket` scenario's host: Traefik proxies WebSocket upgrades without configuration.
    websocket-web:
      rule: Host(`ws.test`)
      entryPoints: [web]
      service: websocket

  services:
    closed:
      loadBalancer:
        serversTransport: bench
        servers:
          - url: http://127.0.0.1:18079
    error-pages:
      loadBalancer:
        serversTransport: bench
        servers:
          - url: http://127.0.0.1:18080
    websocket:
      loadBalancer:
        serversTransport: bench
        servers:
          - url: http://127.0.0.1:18090
    bench:
      loadBalancer:
        serversTransport: bench
        servers:
          - url: http://127.0.0.1:18080
