# Envoy as the reverse proxy under test. Access logs off, loopback only, one worker per CPU (--concurrency 4 on the
# command line). bench.test is proxied with HTTP/1.1 keep-alive to the upstream; respond.test is a direct response,
# which is Envoy's built-in static answer. Envoy sets X-Forwarded-For and -Proto itself; -Host is added explicitly
# because it is not part of Envoy's default set.
static_resources:
  listeners:
    - name: public-plain
      address:
        socket_address: { address: 127.0.0.1, port_value: 18086 }
      filter_chains:
        - filters: &http_filters
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public_plain
                use_remote_address: true
                access_log: []
                upgrade_configs:
                  - upgrade_type: websocket
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: public
                  virtual_hosts:
                    - name: bench
                      domains: ["bench.test", "bench.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          request_headers_to_add:
                            - header:
                                key: x-forwarded-host
                                value: "%REQ(:authority)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: upstream
                            timeout: 120s
                    # The `websocket` scenario's host: the HCM's upgrade_configs lets the upgrade through.
                    - name: websocket
                      domains: ["ws.test", "ws.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: echo
                            timeout: 0s
                            idle_timeout: 120s
                    - name: respond
                      domains: ["respond.test", "respond.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }

    - name: public-tls
      address:
        socket_address: { address: 127.0.0.1, port_value: 18448 }
      filter_chains:
        - filters: *http_filters
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /certs/cert.pem }
                    private_key: { filename: /certs/key.pem }
                alpn_protocols: ["h2", "http/1.1"]

  clusters:
    - name: echo
      connect_timeout: 60s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: echo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 18090 }
    - name: upstream
      connect_timeout: 60s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 18080 }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          common_http_protocol_options:
            idle_timeout: 120s
