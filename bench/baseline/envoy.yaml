# Envoy as the reverse proxy under test. Access logs off (except the access-log scenario's host), loopback only, one worker per CPU (--concurrency 4 on the
# command line). bench.test is proxied with HTTP/1.1 keep-alive to the upstream; respond.test is a direct response,
# which is Envoy's built-in static answer. Envoy sets X-Forwarded-For and -Proto itself; -Host is added explicitly
# because it is not part of Envoy's default set.
static_resources:
  listeners:
    - name: public-plain
      address:
        socket_address: { address: 127.0.0.1, port_value: 18086 }
      filter_chains:
        - filters: &http_filters
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public_plain
                use_remote_address: true
                # Combined-style lines to a file for the access-log scenario's host only, through a filter on the
                # authority that every request evaluates. Envoy's file logger buffers (flushed every few seconds).
                access_log:
                  - name: envoy.access_loggers.file
                    filter:
                      header_filter:
                        header: { name: ":authority", string_match: { prefix: "access-log.test" } }
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.file.v3.FileAccessLog
                      path: /tmp/access.log
                      log_format:
                        text_format_source:
                          inline_string: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% - - [%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %BYTES_SENT% \"%REQ(REFERER)%\" \"%REQ(USER-AGENT)%\"\n"
                # The 502 page for a refused upstream connection (response flag UF, which Envoy would answer with a
                # 503 and a plain-text body).
                local_reply_config:
                  mappers:
                    - filter: { response_flag_filter: { flags: ["UF"] } }
                      status_code: 502
                      body_format_override:
                        text_format_source: { filename: /srv/error-502.html }
                        content_type: "text/html; charset=utf-8"
                upgrade_configs:
                  - upgrade_type: websocket
                http_filters:
                  # Rate limiting is configured per route below; with no bucket here the filter does nothing elsewhere.
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: public
                  virtual_hosts:
                    - name: bench
                      domains: ["bench.test", "bench.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          request_headers_to_add:
                            - header:
                                key: x-forwarded-host
                                value: "%REQ(:authority)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: upstream
                            timeout: 120s
                    # The `websocket` scenario's host: the HCM's upgrade_configs lets the upgrade through.
                    # The comparison scenarios' hosts: the same route as bench.test (a YAML anchor would drag the header
                    # list along; it is short enough to repeat).
                    - name: access-log
                      domains: ["access-log.test", "access-log.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          request_headers_to_add:
                            - header: { key: x-forwarded-host, value: "%REQ(:authority)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route: { cluster: upstream, timeout: 120s }
                    # A local_ratelimit token bucket per route, shared by the workers: it limits the route, not each
                    # client (per-client buckets take descriptors and a rate_limits action; the run has one client).
                    - name: rate-limit
                      domains: ["rate-limit.test", "rate-limit.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          request_headers_to_add:
                            - header: { key: x-forwarded-host, value: "%REQ(:authority)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route: { cluster: upstream, timeout: 120s }
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: rate_allowed
                              token_bucket: { max_tokens: 1048575, tokens_per_fill: 1000000, fill_interval: 1s }
                              filter_enabled: { runtime_key: rate_allowed_enabled, default_value: { numerator: 100, denominator: HUNDRED } }
                              filter_enforced: { runtime_key: rate_allowed_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                    - name: rate-limited
                      domains: ["rate-limited.test", "rate-limited.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          request_headers_to_add:
                            - header: { key: x-forwarded-host, value: "%REQ(:authority)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route: { cluster: upstream, timeout: 120s }
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: rate_refused
                              token_bucket: { max_tokens: 1, tokens_per_fill: 1, fill_interval: 3600s }
                              filter_enabled: { runtime_key: rate_refused_enabled, default_value: { numerator: 100, denominator: HUNDRED } }
                              filter_enforced: { runtime_key: rate_refused_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                    - name: error-page
                      domains: ["error-page.test", "error-page.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          request_headers_to_add:
                            - header: { key: x-forwarded-host, value: "%REQ(:authority)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route: { cluster: closed, timeout: 120s }
                    # cf: only meaningful in the variant the harness starts for the scenario, where the original-IP
                    # detection below (envoy-cf.yml) replaces use_remote_address and the downstream address is
                    # CF-Connecting-IP. Envoy then no longer writes X-Forwarded-For itself, so the route does.
                    - name: cf
                      domains: ["cf.test", "cf.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          request_headers_to_add:
                            - header: { key: x-forwarded-for, value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header: { key: x-forwarded-host, value: "%REQ(:authority)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route: { cluster: upstream, timeout: 120s }
                    - name: websocket
                      domains: ["ws.test", "ws.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: echo
                            timeout: 0s
                            idle_timeout: 120s
                    - name: respond
                      domains: ["respond.test", "respond.test:*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }

    - name: public-tls
      address:
        socket_address: { address: 127.0.0.1, port_value: 18448 }
      filter_chains:
        - filters: *http_filters
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /certs/cert.pem }
                    private_key: { filename: /certs/key.pem }
                alpn_protocols: ["h2", "http/1.1"]

  clusters:
    # Nothing listens here (the error-page scenario); no health checking or outlier detection is configured.
    - name: closed
      connect_timeout: 60s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: closed
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 18079 }
    - name: echo
      connect_timeout: 60s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: echo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 18090 }
    - name: upstream
      connect_timeout: 60s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 18080 }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          common_http_protocol_options:
            idle_timeout: 120s
