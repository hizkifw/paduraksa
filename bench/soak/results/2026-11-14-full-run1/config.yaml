apiVersion: paduraksa.dev/v1
kind: Config
settings:
  unknownHost: notFound
  defaults:
    forceHttps: false
    accessLog: true
  trustedProxies:
    mode: 'off'
    useTrueClientIp: false
    forwardedForFallback: false
    trustForwardedProto: false
  connections:
    maxConnectionsPerIp: 20000
    denyList: blocked
    setsNothing: false
profiles:
  - id: prof_034xDPSWxgR5u6XsuTD49t
    name: public
    settings:
      hsts:
        enabled: true
        maxAge: 31536000
      errorPages:
        '404':
          mode: message
          heading: Nothing here
          text: 'That page does not exist on this soak host.'
        '429':
          mode: message
          heading: Slow down
          text: 'Too many requests.'
        '502':
          mode: message
          heading: Upstream is down
          text: 'The soak upstream did not answer.'
      headers:
        response:
          - name: X-Soak-Profile
            operation: set
            value: public
      compression:
        enabled: true
        minimumSize: 1024
  - id: prof_034xDPSWxgRRTmYhd1Xq7D
    name: internal
    settings:
      rateLimit:
        enabled: true
        policy: mid
      accessList:
        enabled: true
        accessList: lan
      errorPages:
        '404':
          mode: message
          heading: Nothing here
          text: 'That page does not exist on this soak host.'
        '429':
          mode: message
          heading: Slow down
          text: 'Too many requests.'
        '502':
          mode: message
          heading: Upstream is down
          text: 'The soak upstream did not answer.'
