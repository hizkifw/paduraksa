    burst: 1200
    key: clientIp
  - id: rlp_034xDPSWrieS5U6m1EHOsK
    name: limited
    requests: 20
    per: second
    burst: 20
    key: clientIp
accessLists:
  - id: acl_034xDPSWrieo7Gpb88BiLS
    name: lan
    ip:
      dropDenied: false
      allow: [127.0.0.0/8, '::1/128', 10.0.0.0/8, 192.168.0.0/16]
    satisfy: all
    passCredentialsUpstream: false
  - id: acl_034xDPSWrifB6bkz7pHBkV
    name: blocked
    ip:
      dropDenied: false
      deny: [198.51.100.0/24, 203.0.113.0/24]
    satisfy: all
    passCredentialsUpstream: false
ruleSets:
  - id: rs_034xDPSWxgQRldc4jzdSib
    name: scanners
    rules:
      - action: deny
        match:
          path:
            kind: prefix
            pattern: /wp-admin
      - action: deny
        match:
          path:
            kind: exact
            pattern: /.env
      - action: deny
        match:
          userAgent:
            empty: false
            contains: [sqlmap]
