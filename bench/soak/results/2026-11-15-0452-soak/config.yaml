rateLimitPolicies:
  - id: rlp_034xdpT1d5wUC9zKJxJZm2
    name: mid
    requests: 600
    per: second
    burst: 1200
    key: clientIp
  - id: rlp_034xdpT1d5wuA4OLFmKfij
    name: limited
    requests: 20
    per: second
    burst: 20
    key: clientIp
accessLists:
  - id: acl_034xdpT1d5xFGtPhLlrZsF
    name: lan
    ip:
      dropDenied: false
      allow: [127.0.0.0/8, '::1/128', 10.0.0.0/8, 192.168.0.0/16]
    satisfy: all
    passCredentialsUpstream: false
  - id: acl_034xdpT1d5xcQ19FOZxmyX
    name: blocked
    ip:
      dropDenied: false
      deny: [198.51.100.0/24, 203.0.113.0/24]
    satisfy: all
    passCredentialsUpstream: false
ruleSets:
  - id: rs_034xdpT1d5xyWo2GWMVRKQ
    name: scanners
    rules:
      - action: deny
        match:
          path:
            kind: prefix
            pattern: /wp-admin
      - action: deny
        match:
          path:
            kind: exact
            pattern: /.env
      - action: deny
        match:
          userAgent:
            empty: false
            contains: [sqlmap]
authProviders:
  - id: authp_034xdpT1d5yFf0WLhj0MZk
    name: sso
    forwardAuth:
      url: http://127.0.0.1:19900/auth
      preset: custom
      timeoutSeconds: 3
      cacheSeconds: 30
      cacheScope: request
