# Paduraksa v0.1, single node (docs/design/deployment.md "Overview"). Put this file in a directory of its own, create the master key file next to
# it (the commands are under "Master key" below), and run:
#
#   docker compose up -d
#
# The ports are mapped 1:1 on purpose: Paduraksa advertises 443 in Alt-Svc and in its HTTP->HTTPS redirect, so a
# translated in-container port would send clients to the wrong place. 443/udp is HTTP/3; without it the proxy still
# serves H1/H2 over 443/tcp.
services:
  paduraksa:
    # The image CI publishes from every commit on main that passes (amd64 and arm64); a release tag such as `:0.1` once
    # there is one. To build from a checkout instead, run compose from its deploy/ directory with these lines next to
    # `image:` (which then names the local build) and start it with `docker compose up -d --build`:
    #   build:
    #     context: ..
    #     dockerfile: Dockerfile
    image: ghcr.io/hizkifw/paduraksa:main
    container_name: paduraksa
    # A stable MachineName: the admin certificate covers it, so a recreated container keeps the same name set.
    hostname: paduraksa
    # A tiny init reaps orphaned child processes (the healthcheck's short-lived paduraksa process).
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # The admin (sign-in, API, dashboard) is published on loopback only: Docker puts published ports ahead of the
      # host's firewall rules, so a bare "9443:9443" would offer the sign-in page to every network the host is on. Open it
      # from this machine, or through an SSH tunnel (ssh -L 9443:127.0.0.1:9443 you@server). To reach it from your LAN,
      # replace the line with the host's LAN address (never a public one), and see "Exposing the admin port" in docs/operating/admin-access.md:
      - "127.0.0.1:9443:9443"
      # - "192.168.1.10:9443:9443"
    volumes:
      - paduraksa-data:/data
      # /data/logs holds access.log and error.log: rotated by size and day, older files gzipped, trimmed by count, age
      # and total size (Paduraksa__Logs__*). They are 0700/0600, because the access log holds client IPs.
      # A bind mount instead of the named volume: the container runs as uid 10001, so the host directory must be its:
      #   sudo install -d -o 10001 -g 10001 -m 0750 ./data
      # - ./data:/data

    # Hardening. Paduraksa writes only to /data (and /tmp), so the root filesystem is read-only. Every capability is
    # dropped except NET_BIND_SERVICE: the apphost carries it as a file capability for runtimes without Docker's
    # net.ipv4.ip_unprivileged_port_start=0 sysctl, and without it in the bounding set exec of /app/paduraksa fails with
    # EPERM. Kubernetes "restricted" needs the same:
    #   securityContext: { capabilities: { add: ["NET_BIND_SERVICE"] } }
    # alternatively set net.ipv4.ip_unprivileged_port_start=0 in the pod's sysctls.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

    # Master key (docs/design/vault-and-certificates.md "At-rest encryption"). It is a Docker secret, so the key never sits in the data directory: a copy of the volume is
    # not a copy of all your keys. Create the file BEFORE the first `docker compose up` (the container runs as uid 10001
    # and non-swarm Compose mounts a file secret as a bind mount that keeps the *host's* owner and mode):
    #   head -c 32 /dev/urandom | base64 | sudo install -m 400 -o 10001 -g 10001 /dev/stdin master.key
    #
    # WARNING: whichever key the vault is created under is the only key that opens it. Back the key up somewhere
    # separate from the volume; losing it loses every certificate key, secret, TOTP enrolment and the Data Protection
    # key ring (admin sessions are Paduraksa's own random cookie, not in the vault).
    #
    # To try Paduraksa without a key file, delete the `secrets:` and `environment:` blocks below and the top-level `secrets:`; the vault then
    # generates /data/master.key beside vault.db, and the dashboard warns about it.
    secrets:
      - paduraksa-master-key
    environment:
      PADURAKSA_MASTER_KEY_FILE: /run/secrets/paduraksa-master-key

    logging:
      driver: json-file
      options:
        # Keep the setup-token banner long enough to read it out of `docker logs`, without an unbounded file.
        max-size: "10m"
        max-file: "5"

secrets:
  paduraksa-master-key:
    file: ./master.key

volumes:
  paduraksa-data:
